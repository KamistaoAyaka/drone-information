<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .button:hover {
            background: #764ba2;
        }
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 调试页面</h1>
        
        <div class="section">
            <h2>1. 查看文章数据</h2>
            <button class="button" onclick="loadArticles()">加载文章</button>
            <div id="articlesResult"></div>
        </div>
        
        <div class="section">
            <h2>2. 查看数据库原始内容</h2>
            <button class="button" onclick="loadRawArticles()">加载原始数据</button>
            <div id="rawArticlesResult"></div>
        </div>
        
        <div class="section">
            <h2>2. 测试单个AI摘要生成</h2>
            <div>
                <label>选择AI服务商:</label>
                <select id="debugProvider">
                    <option value="deepseek">DeepSeek</option>
                    <option value="openai">OpenAI</option>
                    <option value="claude">Claude</option>
                    <option value="gemini">Gemini</option>
                    <option value="qwen">通义千问</option>
                    <option value="spark">星火认知</option>
                    <option value="zhipu">智谱AI</option>
                </select>
            </div>
            <div>
                <label>API Key:</label>
                <input type="text" id="debugApiKey" style="width: 400px; padding: 8px;">
            </div>
            <div>
                <label>测试内容:</label>
                <textarea id="debugContent" style="width: 100%; height: 100px; padding: 8px;">UAV Navigation–Grupo Oesía Launches VECTOR-300, a New Autopilot Designed for Small and Medium UAVs. The VECTOR-300 is a compact, lightweight autopilot system that offers advanced flight control capabilities. It features a modular design, high processing power, and support for multiple communication protocols. This new product is ideal for industrial applications including aerial surveying, inspection, and mapping.</textarea>
            </div>
            <button class="button" onclick="testSingleSummary()">测试生成</button>
            <div id="singleResult"></div>
        </div>
    </div>

    <script>
        async function loadArticles() {
            const div = document.getElementById('articlesResult');
            div.innerHTML = '<p>加载中...</p>';
            
            try {
                const response = await fetch('/api/debug/articles');
                const data = await response.json();
                div.innerHTML = `<h3>结果 (${data.count} 篇文章):</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                div.innerHTML = `<p style="color: red;">错误: ${error.message}</p>`;
            }
        }
        
        async function loadRawArticles() {
            const div = document.getElementById('rawArticlesResult');
            div.innerHTML = '<p>加载中...</p>';
            
            try {
                const response = await fetch('/api/debug/raw-articles');
                const data = await response.json();
                div.innerHTML = `<h3>结果 (${data.count} 篇文章):</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                div.innerHTML = `<p style="color: red;">错误: ${error.message}</p>`;
            }
        }
        
        async function testSingleSummary() {
            const provider = document.getElementById('debugProvider').value;
            const apiKey = document.getElementById('debugApiKey').value;
            const content = document.getElementById('debugContent').value;
            const div = document.getElementById('singleResult');
            
            if (!apiKey) {
                div.innerHTML = '<p style="color: red;">请输入API Key</p>';
                return;
            }
            
            div.innerHTML = '<p>生成中...</p>';
            
            try {
                const response = await fetch('/api/ai/generate_summaries', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        articles: [{
                            id: 'test-1',
                            title: 'Test Article',
                            content: content,
                            summary: ''
                        }],
                        provider: provider,
                        api_key: apiKey
                    })
                });
                
                const data = await response.json();
                div.innerHTML = `<h3>结果:</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                div.innerHTML = `<p style="color: red;">错误: ${error.message}</p>`;
                console.error(error);
            }
        }
    </script>
</body>
</html>
