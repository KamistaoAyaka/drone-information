<h3>文章摘要</h3>
<p>英国交通警察局（BTP）是一支专门负责英格兰、苏格兰和威尔士铁路网络及交通系统治安的警察力量。作为交通警务领域的先驱，BTP警员日复一日不懈努力，保障数百万乘客及工作人员的安全。其职责包括预防和调查盗窃、破坏公物、恐怖主义等犯罪活动，同时维护公共秩序，应对列车、车站及其他交通设施中的突发事件。</p>
