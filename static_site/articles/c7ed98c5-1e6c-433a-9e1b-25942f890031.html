<p>SpaceX的星舰计划向第12次飞行测试迈进一步，成功完成了超重型助推器和星舰上面级的静态点火测试。助推器在发射场点燃全部33台猛禽发动机，而星舰则单独进行了静态点火。这些测试在即将到来的发射前验证了关键系统，该发射旨在展示轨道能力和可重复使用性。这一里程碑使星舰更接近下一次飞行，但仍需等待监管批准和最终检查。</p>
