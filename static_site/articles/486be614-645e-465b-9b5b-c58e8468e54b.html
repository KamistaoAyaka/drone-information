<h3>文章摘要</h3>
<p>一名机场工作人员的一次无心之失，导致哥本哈根空域全面关闭超过一小时。事件起因是哥本哈根机场一名员工报告称在跑道附近发现无人机。按照标准安全规程，空中交通管制员立即暂停了所有起降航班，影响数十架航班及数千名乘客。然而经警方与机场安保人员全面搜查后，并未发现任何无人机踪迹。调查人员随后确认，这起事件实为工作人员将某物误认为无人机所致。</p>
