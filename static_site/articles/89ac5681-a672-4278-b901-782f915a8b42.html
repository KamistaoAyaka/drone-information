<p>美国联邦航空管理局（FAA）宣布将对2026年国际足联世界杯实施严格的空域限制措施。该届世界杯将在美国、加拿大和墨西哥的多座城市举办。这些措施旨在保障这场预计吸引数百万观众、引发全球高度关注的赛事安全。限制措施将包括在所有体育场馆、球迷区及其他关键区域上空及周边设立临时飞行限制区（TFRs）。</p>
